# Собирает Roadmaps.exe в облаке GitHub.
# Запуск: вкладка Actions -> Build -> Run workflow, либо создайте тег вида v1.0.0 — архив прикрепится к релизу.
name: Build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: >
          pyinstaller --noconfirm --onedir --noconsole --name Roadmaps --icon assets/icon.ico
          --add-data "ui;ui" --add-data "examples;examples" app.py
      - run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md dist/Roadmaps/
          Compress-Archive -Path dist/Roadmaps -DestinationPath Roadmaps.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: Roadmaps
          path: Roadmaps.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Roadmaps.zip
